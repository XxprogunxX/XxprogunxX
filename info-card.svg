<rect x="162" y="401" width="20" height="10" rx="2" fill="#56d4dd" class="line" style="animation-delay: 1.30s;" />
<rect x="185" y="387" width="20" height="10" rx="2" fill="#b1bac4" class="line" style="animation-delay: 1.30s;" />
