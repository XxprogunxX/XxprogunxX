<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 460" width="490" height="460" fill="none">
  <defs>
    <style>
      @keyframes lineFadeIn {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .terminal-bg {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1px;
      }
      .header-bar {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1px;
      }
      .terminal-title {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 11px;
        fill: #8b949e;
        font-weight: 500;
      }
      .line {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
        font-size: 11.5px;
        opacity: 0; animation: lineFadeIn 0.35s ease forwards;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="490" height="460" rx="8" class="terminal-bg" />
  
  <!-- Header Bar -->
  <path d="M 0 8 Q 0 0 8 0 L 482 0 Q 490 0 490 8 L 490 32 L 0 32 Z" class="header-bar" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="16" r="5.5" fill="#ff5f56" />
  <circle cx="38" cy="16" r="5.5" fill="#ffbd2e" />
  <circle cx="56" cy="16" r="5.5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="245" y="20" text-anchor="middle" class="terminal-title">javier@github: ~/neofetch</text>

  <!-- Content Lines -->
    <text x="24" y="62" class="line" style="animation-delay: 0.00s;"><tspan fill="#58a6ff" font-weight="700">javier</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#7ee787" font-weight="700">XxprogunxX</tspan></text>
    <text x="24" y="83" class="line" style="animation-delay: 0.08s;"><tspan fill="#30363d">--------------------------------------------------</tspan></text>
    <text x="24" y="104" class="line" style="animation-delay: 0.16s;"><tspan fill="#d2a8ff" font-weight="600">OS:</tspan><tspan fill="#c9d1d9"> Web &amp; Cloud Environment</tspan></text>
    <text x="24" y="125" class="line" style="animation-delay: 0.24s;"><tspan fill="#d2a8ff" font-weight="600">Role:</tspan><tspan fill="#c9d1d9"> Software Developer | Full Stack</tspan></text>
    <text x="24" y="146" class="line" style="animation-delay: 0.32s;"><tspan fill="#d2a8ff" font-weight="600">Specialty:</tspan><tspan fill="#c9d1d9"> E-commerce &amp; Payment Gateways (Mercado Pago)</tspan></text>
    <text x="24" y="167" class="line" style="animation-delay: 0.40s;"><tspan fill="#d2a8ff" font-weight="600">Frontend:</tspan><tspan fill="#c9d1d9"> React, Next.js, TypeScript, Tailwind CSS</tspan></text>
    <text x="24" y="188" class="line" style="animation-delay: 0.48s;"><tspan fill="#d2a8ff" font-weight="600">Backend:</tspan><tspan fill="#c9d1d9"> Node.js, Express, Prisma, GraphQL</tspan></text>
    <text x="24" y="209" class="line" style="animation-delay: 0.56s;"><tspan fill="#d2a8ff" font-weight="600">Databases:</tspan><tspan fill="#c9d1d9"> PostgreSQL, MySQL, Redis</tspan></text>
    <text x="24" y="230" class="line" style="animation-delay: 0.64s;"><tspan fill="#d2a8ff" font-weight="600">DevOps:</tspan><tspan fill="#c9d1d9"> Docker, Cloudflare Workers, Linux, Vercel</tspan></text>
    <text x="24" y="251" class="line" style="animation-delay: 0.72s;"><tspan fill="#30363d">--------------------------------------------------</tspan></text>
    <text x="24" y="272" class="line" style="animation-delay: 0.80s;"><tspan fill="#d2a8ff" font-weight="600">Project 1:</tspan><tspan fill="#c9d1d9"> 🥖 Panaderia (E-commerce + Mercado Pago)</tspan></text>
    <text x="24" y="293" class="line" style="animation-delay: 0.88s;"><tspan fill="#d2a8ff" font-weight="600">Project 2:</tspan><tspan fill="#c9d1d9"> 📋 TASKFLOW (Agile Task Management)</tspan></text>
    <text x="24" y="314" class="line" style="animation-delay: 0.96s;"><tspan fill="#d2a8ff" font-weight="600">Project 3:</tspan><tspan fill="#c9d1d9"> 📲 OrderFlow (Active Order System)</tspan></text>
    <text x="24" y="335" class="line" style="animation-delay: 1.04s;"><tspan fill="#d2a8ff" font-weight="600">Location:</tspan><tspan fill="#c9d1d9"> Mexico 🇲🇽</tspan></text>
    <text x="24" y="356" class="line" style="animation-delay: 1.12s;"><tspan fill="#d2a8ff" font-weight="600">Status:</tspan><tspan fill="#c9d1d9"> 🟢 Open to impactful projects &amp; freelance</tspan></text>

  <!-- Terminal Color Palette -->
  <rect x="24" y="387" width="20" height="10" rx="2" fill="#0d1117" class="line" style="animation-delay: 1.30s;" />
