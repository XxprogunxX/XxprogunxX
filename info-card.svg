<rect x="93" y="401" width="20" height="10" rx="2" fill="#e3b341" class="line" style="animation-delay: 1.30s;" />
<rect x="116" y="387" width="20" height="10" rx="2" fill="#58a6ff" class="line" style="animation-delay: 1.30s;" />
<rect x="116" y="401" width="20" height="10" rx="2" fill="#79c0ff" class="line" style="animation-delay: 1.30s;" />
